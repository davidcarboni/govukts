name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # Required for npm provenance and OIDC Trusted Publishers auth

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - run: npm i

      - name: Publish
        run: npm publish --provenance
